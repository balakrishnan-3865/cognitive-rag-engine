version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${POSTGRES_CONTAINER_NAME:-cognitive-rag-postgres}
    environment:
      POSTGRES_DB: ${DB_NAME:-cognitive_rag_engine}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cognitive-rag-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ${MINIO_CONTAINER_NAME:-cognitive-rag-minio}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cognitive-rag-network

  # Elasticsearch for sparse text/data storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: ${ELASTICSEARCH_CONTAINER_NAME:-cognitive-rag-elasticsearch}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTICSEARCH_PASSWORD:-changeme} http://localhost:9200/_cluster/health | grep -q '\"status\":\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cognitive-rag-network

  # ElasticVue - Elasticsearch Web UI
  elasticvue:
    image: cars10/elasticvue:latest
    container_name: ${ELASTICVUE_CONTAINER_NAME:-cognitive-rag-elasticvue}
    ports:
      - "${ELASTICVUE_PORT:-8088}:8080"
    environment:
      - ELASTICVUE_ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICVUE_ELASTICSEARCH_USERNAME=elastic
      - ELASTICVUE_ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
    restart: unless-stopped
    depends_on:
      - elasticsearch
    networks:
      - cognitive-rag-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  cognitive-rag-network:
    driver: bridge
