spring:
  application:
    name: cognitive-rag-engine-test

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # PostgreSQL DataSource Configuration (Test)
  # Using port 5433 from docker-compose-test.yml to avoid conflicts
  datasource:
    url: jdbc:postgresql://localhost:5433/cognitive_rag_engine_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  # Elasticsearch Configuration (Test)
  # Using port 9201 from docker-compose-test.yml with test credentials
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9201}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:testpassword}

  # Spring AI - Ollama Configuration (Test)
  # Using local Ollama instance on default port 11434
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1
      embedding:
        options:
          model: nomic-embed-text
          truncate: true
    vectorstore:
      pgvector:
        max-document-batch-size: 50

  # Async Task Execution Configuration
  task:
    execution:
      shutdown:
        await-termination-period: 30s

  # Flyway Database Migration
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT Configuration (Test) - fixed secret/short TTLs, no dependency on local .env
jwt:
  secret: test-jwt-secret-key-for-integration-tests-minimum-32-bytes-long
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 604800

# CORS Configuration (Test) - fixed origin, no dependency on local .env
cors:
  allowed-origins: http://localhost:4200

  # Disable lazy initialization check to prevent Ollama validation at startup
  lazy-initialization: false

  # Enable autoconfiguration debugging for troubleshooting
  main:
    lazy-initialization: false

# Observability - tracing/OTLP export is not relevant to integration tests and must not require
# a real Langfuse endpoint to be reachable just to resolve placeholders at context startup.
management:
  tracing:
    sampling:
      probability: 0.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${LANGFUSE_OTEL_ENDPOINT:http://localhost:4318/v1/traces}
          headers:
            Authorization: ${LANGFUSE_OTEL_AUTH_HEADER}
            x-langfuse-ingestion-version: "4"

# Document Ingestion Configuration (Test)
document:
  ingestion:
    embedding-batch-size: 10
    elasticsearch-batch-size: 50
    max-retries: 2
    initial-retry-delay-ms: 500
    retry-backoff-multiplier: 2.0

  # Document Upload Configuration (Test)
  upload:
    max-file-size: 20MB
    max-filename-length: 255
    max-extension-length: 10
    supported-extensions: pdf

# MinIO Object Storage Configuration (Test)
# Shares the dev MinIO instance (deploy/docker-compose.yml) - no isolated test container.
storage:
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: cognitive-rag-engine

# QA Configuration - LLM generation and final result limiting (Test)
qa:
  top-k: 3
  chat-timeout-ms: 30000
  temperature: 0.3
  max-tokens: 2000

# Retrieval Configuration - Dense + Sparse RRF Fusion (Test)
retrieval:
  dense:
    top-k: 20
    similarity-threshold: 0.5
  sparse:
    top-k: 20
    min-score-percentile: 0.5
  fusion:
    strategy: rrf
    rrf-k: 60
    weights:
      dense: 0.5
      sparse: 0.5
  reranker:
    enabled: true
    model-path: models/ms-marco-MiniLM-L-6-v2/model.onnx
    tokenizer-path: models/ms-marco-MiniLM-L-6-v2/tokenizer.json
    max-sequence-length: 512
    max-candidates: 20
    parallelism: 4
    timeout-ms: 8000

# Assistant Configuration - ReAct agent with RAG exposed as a tool (Test)
assistant:
  top-k-default: 3
  max-model-calls: 5
  tool-timeout-ms: 30000
  max-history-turns: 8
  summarization-trigger-message-count: 6

# Observability - raw prompt/completion capture (Test)
observability:
  capture-content: true

# Classifier Configuration - Intent classification model (Test)
# Uses the Groq API like production; api-key falls back to a dummy value when
# CLASSIFIER_API_KEY isn't set so context load never depends on real credentials.
classifier:
  model:
    name: llama-3.1-8b-instant
    api-key: ${CLASSIFIER_API_KEY:test-classifier-api-key}
    base-url: https://api.groq.com/openai/v1
    options:
      temperature: 0.1
      max-tokens: 200

# Workflow Configuration - Claims query agent orchestrator StateGraph (Test)
workflow:
  graph-recursion-limit: 8

# Application Configuration - Custom app-level settings (Test)
app:
  ingestion:
    recovery:
      interval-seconds: 3600

# Resilience4j: Circuit Breaker (Test) - small sliding windows and short open-state wait so
# breaker tests can force CLOSED -> OPEN -> HALF_OPEN -> CLOSED transitions quickly and deterministically.
resilience4j:
  circuitbreaker:
    instances:
      embedding-batch:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 500
        permittedNumberOfCallsInHalfOpenState: 2
      elasticsearch-batch:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 500
        permittedNumberOfCallsInHalfOpenState: 2

# Logging Configuration (Test)
logging:
  level:
    root: WARN
    com.skyshift.cognitiveragengine: DEBUG
    org.springframework.test: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"