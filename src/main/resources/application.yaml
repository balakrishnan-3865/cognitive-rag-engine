spring:
  application:
    name: cognitive-rag-engine
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # PostgreSQL DataSource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cognitive_rag_engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # Spring AI - DashScope (Alibaba) Configuration and Ollama
  ai:
    model:
      chat: ollama
      embedding: ollama
    # dashscope:
    #   api-key: ${DASHSCOPE_API_KEY:}
    #   chat:
    #     options:
    #       model: glm-5
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mistral:7b
      embedding:
        options:
          model: nomic-embed-text
          truncate: true
    # Vector Store Configuration (PgVector)
    vectorstore:
      pgvector:
        dimensions: 768           # Match embedding model (nomic-embed-text)
        distance-type: COSINE_DISTANCE     # Options: COSINE, EUCLIDEAN, INNER_PRODUCT
        index-type: HNSW          # Options: HNSW, IVFFLAT
        initialize-schema: true   # Auto-creates vector_store table on startup
        max-document-batch-size: ${VECTORSTORE_BATCH_SIZE:100}  # Batch size for vector ingestion

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:changeme}

  # Async Task Execution Configuration
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: async-task-

  # Flyway Database Migration
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# Document Ingestion Configuration (Phase 2.2)
document:
  ingestion:
    chunk-size-tokens: ${DOCUMENT_INGESTION_CHUNK_SIZE_TOKENS:220}
    chunk-overlap-percentage: ${DOCUMENT_INGESTION_CHUNK_OVERLAP_PERCENTAGE:20}
    embedding-batch-size: ${DOCUMENT_INGESTION_EMBEDDING_BATCH_SIZE:50}
    elasticsearch-batch-size: ${DOCUMENT_INGESTION_ELASTICSEARCH_BATCH_SIZE:50}
    max-retries: ${DOCUMENT_INGESTION_MAX_RETRIES:3}
    initial-retry-delay-ms: ${DOCUMENT_INGESTION_INITIAL_RETRY_DELAY_MS:1000}
    retry-backoff-multiplier: ${DOCUMENT_INGESTION_RETRY_BACKOFF_MULTIPLIER:2.0}

  # Document Upload Configuration
  upload:
    # Maximum file size in bytes (50 MB)
    # Environment variable: DOCUMENT_UPLOAD_MAX_FILE_SIZE
    max-file-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE:52428800}

    # Maximum filename length (excluding extension)
    # Environment variable: DOCUMENT_UPLOAD_MAX_FILENAME_LENGTH
    max-filename-length: ${DOCUMENT_UPLOAD_MAX_FILENAME_LENGTH:255}

    # Maximum file extension length
    # Environment variable: DOCUMENT_UPLOAD_MAX_EXTENSION_LENGTH
    max-extension-length: ${DOCUMENT_UPLOAD_MAX_EXTENSION_LENGTH:10}

    # Supported file extensions (case-insensitive, comma-separated)
    # Environment variable: DOCUMENT_UPLOAD_SUPPORTED_EXTENSIONS
    supported-extensions: ${DOCUMENT_UPLOAD_SUPPORTED_EXTENSIONS:pdf}

# MinIO Object Storage Configuration
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET_NAME:cognitive-rag-engine}

# QA Configuration (Stage 3)
qa:
  top-k-default: ${QA_TOP_K_DEFAULT:20}
  similarity-threshold: ${QA_SIMILARITY_THRESHOLD:0.5}
  chat-timeout-ms: ${QA_CHAT_TIMEOUT_MS:30000}
  temperature: ${QA_TEMPERATURE:0.7}
  max-tokens: ${QA_MAX_TOKENS:2000}

# Hybrid Search Configuration (Stage 4 - Dense + Sparse RRF Fusion)
hybrid-search:
  # Per-source candidate depth fetched from each retriever before RRF fusion and truncation to qa.top-k-default
  candidate-pool-size: ${HYBRID_SEARCH_CANDIDATE_POOL_SIZE:30}

# Observability - traces (ChatClient/Advisor/VectorStore/EmbeddingModel spans) export to Langfuse
# via OTLP; operational + rag.* metrics export to Prometheus/Grafana (deploy/observability) via
# the /actuator/prometheus scrape endpoint. See docs/STAGE5_EVAL_OBSERVABILITY_PLAN.md.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}  # trace every request; this is an eval/dev setup, not high-throughput prod
  otlp:
    tracing:
      endpoint: ${LANGFUSE_OTEL_ENDPOINT:http://localhost:3000/api/public/otel/v1/traces}
      headers:
        Authorization: ${LANGFUSE_OTEL_AUTH_HEADER:}  # Basic base64(publicKey:secretKey) from a Langfuse project's API keys; set in local .env, never commit the real value
        x-langfuse-ingestion-version: "4"
  endpoints:
    web:
      exposure:
        include: health,prometheus

