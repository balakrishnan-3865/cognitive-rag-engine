spring:
  application:
    name: cognitive-rag-engine
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Async Task Execution Configuration
  task:
    execution:
      pool:
        # Core pool size for async task execution
        core-size: 5
        # Maximum pool size for async task execution
        max-size: 10
        # Queue capacity for pending async tasks
        queue-capacity: 100
      # Thread name prefix for identification
      thread-name-prefix: cognitive-rag-async-

  # PostgreSQL DataSource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cognitive_rag_engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # Spring AI - DashScope (Alibaba) Configuration and Ollama
  ai:
    model:
      chat: ollama
      embedding: ollama
    # dashscope:
    #   api-key: ${DASHSCOPE_API_KEY:}
    #   chat:
    #     options:
    #       model: glm-5
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1
      embedding:
        options:
          model: nomic-embed-text
          truncate: true
    # Vector Store Configuration (PgVector)
    vectorstore:
      pgvector:
        dimensions: 768           # Match embedding model (nomic-embed-text)
        distance-type: COSINE_DISTANCE     # Options: COSINE, EUCLIDEAN, INNER_PRODUCT
        index-type: HNSW          # Options: HNSW, IVFFLAT
        initialize-schema: true   # Auto-creates vector_store table on startup

  # Flyway Database Migration
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# Document Upload Configuration
document:
  upload:
    # Maximum file size in bytes (50 MB)
    # Environment variable: DOCUMENT_UPLOAD_MAX_FILE_SIZE
    max-file-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE:52428800}

    # Maximum filename length (excluding extension)
    # Environment variable: DOCUMENT_UPLOAD_MAX_FILENAME_LENGTH
    max-filename-length: ${DOCUMENT_UPLOAD_MAX_FILENAME_LENGTH:255}

    # Maximum file extension length
    # Environment variable: DOCUMENT_UPLOAD_MAX_EXTENSION_LENGTH
    max-extension-length: ${DOCUMENT_UPLOAD_MAX_EXTENSION_LENGTH:10}

    # Supported file extensions (case-insensitive, comma-separated)
    # Environment variable: DOCUMENT_UPLOAD_SUPPORTED_EXTENSIONS
    supported-extensions: ${DOCUMENT_UPLOAD_SUPPORTED_EXTENSIONS:pdf}

# MinIO Object Storage Configuration
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET_NAME:cognitive-rag-engine}

# Logging Configuration
logging:
  level:
    root: INFO
    com.skyshift.cognitiveragengine: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
