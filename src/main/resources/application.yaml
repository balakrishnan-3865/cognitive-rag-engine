spring:
  application:
    name: cognitive-rag-engine

  # PostgreSQL DataSource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cognitive_rag_engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # Spring AI - DashScope (Alibaba) Configuration and Ollama
  ai:
    model:
      chat: ollama
      embedding: ollama
    # dashscope:
    #   api-key: ${DASHSCOPE_API_KEY:}
    #   chat:
    #     options:
    #       model: glm-5
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1
      embedding:
        options:
          model: nomic-embed-text
          truncate: true
    # Vector Store Configuration (PgVector)
    vectorstore:
      pgvector:
        dimensions: 768           # Match embedding model (nomic-embed-text)
        distance-type: COSINE_DISTANCE     # Options: COSINE, EUCLIDEAN, INNER_PRODUCT
        index-type: HNSW          # Options: HNSW, IVFFLAT
        initialize-schema: true   # Auto-creates vector_store table on startup

  # Flyway Database Migration
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# MinIO Object Storage Configuration
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET_NAME:cognitive-rag-engine}

# Logging Configuration
logging:
  level:
    root: INFO
    com.skyshift.cognitiveragengine: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
