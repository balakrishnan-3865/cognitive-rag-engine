logging:
  level:
    org.springframework.transaction: DEBUG
    org.springframework.context.event: DEBUG
    org.springframework.scheduling: DEBUG
    com.skyshift.cognitiveragengine: DEBUG
    org.springframework.ai: DEBUG

# Resilience4j: Automatic retry with exponential backoff for transient failures
resilience4j:
  retry:
    # Explicit Spring AOP aspect order: lower value = outer advice. CircuitBreaker must wrap
    # Retry (not the reverse, which is Resilience4j's Spring Boot default) so that a batch's
    # full retry cycle counts as ONE breaker outcome, and a breaker-OPEN call skips Retry (and
    # the downstream call) entirely instead of being evaluated per individual retry attempt.
    retryAspectOrder: 2
    instances:
      embedding-batch:
        maxAttempts: 3
        waitDuration: 100  # milliseconds
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        randomizedWaitDuration: true
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException
        doNotRetry:
          - com.skyshift.cognitiveragengine.common.exception.BusinessException
          - IllegalArgumentException
          - java.lang.OutOfMemoryError

      elasticsearch-batch:
        maxAttempts: 5  # More lenient (not token-consuming)
        waitDuration: 500
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        randomizedWaitDuration: true
        retryExceptions:
          - java.io.IOException
          - co.elastic.clients.transport.rest5_client.low_level.ResponseException

  # Resilience4j: Circuit Breaker - stops calling a dependency once its recent failure rate
  # crosses the threshold, so a struggling pgVector/Elasticsearch isn't hammered by every
  # batch's full retry cycle. Wraps Retry (Retry's aspect order runs inside CircuitBreaker's),
  # so one breaker outcome = one fully-retried batch call, not one raw attempt.
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      embedding-batch:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${CIRCUITBREAKER_EMBEDDING_SLIDING_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${CIRCUITBREAKER_EMBEDDING_MINIMUM_CALLS:5}
        failureRateThreshold: ${CIRCUITBREAKER_EMBEDDING_FAILURE_RATE_THRESHOLD:50}
        waitDurationInOpenState: ${CIRCUITBREAKER_EMBEDDING_WAIT_DURATION_OPEN_STATE_MS:10000}
        permittedNumberOfCallsInHalfOpenState: ${CIRCUITBREAKER_EMBEDDING_HALF_OPEN_CALLS:3}

      elasticsearch-batch:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${CIRCUITBREAKER_ELASTICSEARCH_SLIDING_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${CIRCUITBREAKER_ELASTICSEARCH_MINIMUM_CALLS:5}
        failureRateThreshold: ${CIRCUITBREAKER_ELASTICSEARCH_FAILURE_RATE_THRESHOLD:50}
        waitDurationInOpenState: ${CIRCUITBREAKER_ELASTICSEARCH_WAIT_DURATION_OPEN_STATE_MS:15000}
        permittedNumberOfCallsInHalfOpenState: ${CIRCUITBREAKER_ELASTICSEARCH_HALF_OPEN_CALLS:3}

# Classifier Configuration - Intent classification model
classifier:
  model:
    name: ${CLASSIFIER_MODEL_NAME}
    api-key: ${CLASSIFIER_API_KEY}
    base-url: ${CLASSIFIER_BASE_URL}
    options:
      temperature: ${CLASSIFIER_TEMPERATURE}
      max-tokens: ${CLASSIFIER_MAX_TOKENS}

# Workflow Configuration - Claims query agent orchestrator StateGraph
workflow:
  graph-recursion-limit: ${WORKFLOW_GRAPH_RECURSION_LIMIT:8}

# Application Configuration - Custom app-level settings
app:
  ingestion:
    recovery:
      interval-seconds: ${APP_INGESTION_RECOVERY_INTERVAL_SECONDS}