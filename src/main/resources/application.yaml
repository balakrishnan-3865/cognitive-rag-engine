spring:
  application:
    name: cognitive-rag-engine
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE}
      max-request-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE}

  # PostgreSQL DataSource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # Spring AI - Groq (via OpenAI-compatible API) Configuration (ChatModel) and Ollama (Embeddings)
  ai:
    model:
      chat: openai
      embedding: ollama
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: ${QA_TEMPERATURE}
          top-p: 1.0
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: qwen3-embedding:0.6b
          truncate: false
    # Vector Store Configuration (PgVector)
    vectorstore:
      pgvector:
        dimensions: 1024           # Match embedding model (qwen3-embedding:0.6b)
        distance-type: COSINE_DISTANCE     # Options: COSINE, EUCLIDEAN, INNER_PRODUCT
        index-type: HNSW          # Options: HNSW, IVFFLAT
        initialize-schema: true   # Auto-creates vector_store table on startup
        max-document-batch-size: ${VECTORSTORE_BATCH_SIZE}

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URI}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}

  # Async Task Execution Configuration
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: async-task-
      # Shutdown timeout for bounded async task completion
      # Prevents indefinite hanging of async tasks in distributed systems
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_EXECUTION_SHUTDOWN_PERIOD_SECONDS}s

  # Flyway Database Migration
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT Configuration - stateless access tokens, opaque (hashed) refresh tokens
jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS}

# CORS Configuration - origins allowed to call the API cross-origin (e.g. the Angular dev server)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Document Ingestion Configuration
document:
  ingestion:
    embedding-batch-size: ${DOCUMENT_INGESTION_EMBEDDING_BATCH_SIZE}
    elasticsearch-batch-size: ${DOCUMENT_INGESTION_ELASTICSEARCH_BATCH_SIZE}
    max-retries: ${DOCUMENT_INGESTION_MAX_RETRIES}
    initial-retry-delay-ms: ${DOCUMENT_INGESTION_INITIAL_RETRY_DELAY_MS}
    retry-backoff-multiplier: ${DOCUMENT_INGESTION_RETRY_BACKOFF_MULTIPLIER}

  # Document Upload Configuration
  upload:
    max-file-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE}
    max-filename-length: ${DOCUMENT_UPLOAD_MAX_FILENAME_LENGTH}
    max-extension-length: ${DOCUMENT_UPLOAD_MAX_EXTENSION_LENGTH}
    supported-extensions: ${DOCUMENT_UPLOAD_SUPPORTED_EXTENSIONS}

# MinIO Object Storage Configuration
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET_NAME}

# Docling Sidecar Configuration
docling:
  base-url: ${DOCLING_BASE_URL:http://localhost:5001}
  max-chunk-size-chars: ${DOCLING_MAX_CHUNK_SIZE_CHARS:1200}
  poll-interval-ms: ${DOCLING_POLL_INTERVAL_MS:2000}
  poll-max-attempts: ${DOCLING_POLL_MAX_ATTEMPTS:150}

# QA Configuration - LLM generation and final result limiting
qa:
  top-k: ${QA_TOP_K_DEFAULT}
  chat-timeout-ms: ${QA_CHAT_TIMEOUT_MS}
  temperature: ${QA_TEMPERATURE}
  max-tokens: ${QA_MAX_TOKENS}

# Retrieval Configuration - Dense + Sparse RRF Fusion
retrieval:
  dense:
    top-k: ${RETRIEVAL_DENSE_TOP_K}
    similarity-threshold: ${RETRIEVAL_DENSE_SIMILARITY_THRESHOLD}
  sparse:
    top-k: ${RETRIEVAL_SPARSE_TOP_K}
    min-score-percentile: ${RETRIEVAL_SPARSE_MIN_SCORE_PERCENTILE}
  fusion:
    strategy: ${RETRIEVAL_FUSION_STRATEGY}
    rrf-k: ${RETRIEVAL_FUSION_RRF_K}
    weights:
      dense: ${RETRIEVAL_FUSION_WEIGHTS_DENSE}
      sparse: ${RETRIEVAL_FUSION_WEIGHTS_SPARSE}
  reranker:
    enabled: ${RETRIEVAL_RERANKER_ENABLED}
    model-path: ${RETRIEVAL_RERANKER_MODEL_PATH}
    tokenizer-path: ${RETRIEVAL_RERANKER_TOKENIZER_PATH}
    max-sequence-length: ${RETRIEVAL_RERANKER_MAX_SEQUENCE_LENGTH}
    max-candidates: ${RETRIEVAL_RERANKER_MAX_CANDIDATES}
    parallelism: ${RETRIEVAL_RERANKER_PARALLELISM}
    timeout-ms: ${RETRIEVAL_RERANKER_TIMEOUT_MS}

# Assistant Configuration - ReAct agent with RAG exposed as a tool
assistant:
  top-k-default: ${ASSISTANT_TOP_K_DEFAULT}
  max-model-calls: ${ASSISTANT_MAX_MODEL_CALLS}
  tool-timeout-ms: ${ASSISTANT_TOOL_TIMEOUT_MS}
  max-history-turns: ${ASSISTANT_MAX_HISTORY_TURNS}
  summarization-trigger-message-count: ${ASSISTANT_SUMMARIZATION_TRIGGER_MESSAGE_COUNT}

# Observability - raw prompt/completion capture on the chat-model span (gen_ai.prompt/gen_ai.completion),
# for offline groundedness evaluation. Vendor-neutral OTel attributes only - no backend-specific config.
observability:
  capture-content: ${OBSERVABILITY_CAPTURE_CONTENT}

# Observability - traces export to Langfuse via OTLP; metrics export to Prometheus via /actuator/prometheus

management:
  observations:
    http:
      client:
        enabled: false  # Disables noisy RestClient, WebClient, and RestTemplate spans
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  otlp:
    metrics:
      export:
        enabled: false  # Metrics are pulled via /actuator/prometheus; the push-based OTLP metrics
                         # sender has no configured collector and otherwise floods logs with
                         # "Connection refused" retrying against its default localhost:4318 target
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Langfuse standard OTel ingestion endpoint
          endpoint: ${LANGFUSE_OTEL_ENDPOINT}
          headers:
            # Map your Langfuse project authentication tokens
            Authorization: ${LANGFUSE_OTEL_AUTH_HEADER}
            x-langfuse-ingestion-version: "4"

# Logging Configuration
#logging:
